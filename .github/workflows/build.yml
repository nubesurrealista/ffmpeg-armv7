name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: publish release
        type: boolean
        default: true
  schedule:
    # monthly: pick up the latest 9.0.x patch
    - cron: '0 4 1 * *'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ffmpeg: ${{ steps.meta.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@v7
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gpg zip unzip xz-utils
      - name: build
        run: ./scripts/build.sh
      - name: meta
        id: meta
        run: |
          . dist/versions.env
          echo "ffmpeg=$FFMPEG_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-armv7
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-armv7
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ffmpeg-${{ needs.build.outputs.ffmpeg }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "personal use"
          gh release upload "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
